name: Release

# Manual only: nothing is versioned or published without an explicit run and
# approval of the protected `npm` environment.
on:
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version PR or detect publish
    runs-on: ubuntu-latest
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create or update the "Version packages" PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm (trusted publishing)
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write # OIDC for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm >= 11.5 for trusted publishing
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium && node scripts/smoke-test.mjs
      - name: Publish if this version is not on npm yet
        working-directory: packages/react-docscope
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published"; exit 0
          fi
          npm publish --provenance --access public
          git tag "$NAME@$VERSION" && git push origin "$NAME@$VERSION"
